<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
    <title>ReUnity</title>
    
    <!-- PWA Meta Tags -->
    <meta name="description" content="ReUnity - A trauma-aware AI companion for fragmented identity states. Built from physics. Built from pain." />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ReUnity" />
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Favicon and Icons -->
    <link rel="icon" type="image/png" href="/reop-logo.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    
    <!-- Open Graph / Social -->
    <meta property="og:title" content="ReUnity - Trauma-Aware AI Support" />
    <meta property="og:description" content="A recursive AI companion for fragmented identity states. Built from physics. Built from pain." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://reunityai-6dthfgbd.manus.space" />
    <meta property="og:image" content="/fractured-spiral-bg-wide.png" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ReUnity - Trauma-Aware AI Support" />
    <meta name="twitter:description" content="A recursive AI companion for fragmented identity states." />
    <meta name="twitter:image" content="/fractured-spiral-bg-wide.png" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
    
    <!-- Register Service Worker -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(registration => {
              console.log('SW registered:', registration.scope);
            })
            .catch(error => {
              console.log('SW registration failed:', error);
            });
        });
      }
    </script>
  </body>

</html>
